<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yourself</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">


<style>
	*{box-sizing:border-box;}

	body{
		margin:0;
		overflow:hidden;
		font-family:sans-serif;
		background-image:url("nen1.png");
		background-size:cover;
		background-position:center;
		background-repeat:no-repeat;}


	.overlay{
		position:fixed;
		inset:0;
		background:rgba(0,0,0,0.25);
		z-index:-1;}


	.app-container{
		max-width:375px;
		margin:auto;
		height:100vh;
		display:flex;
		justify-content:center;
		align-items:center;
		padding-top:env(safe-area-inset-top);
		padding-bottom:env(safe-area-inset-bottom);
		padding-left:10px;
		padding-right:10px;}


	.card-1{
		width:100%;
		height:600px;
		border-radius:20px;
		background:transparent;
		display:flex;
		justify-content:center;
		align-items:flex-start;
		transform:translateY(-30px);}


	.card-2{
		width:300px;
		height:260px;
		margin-top:0px;
		border-radius:20px;
		position:relative;
		box-shadow:0 8px 20px rgba(0,0,0,0.3);}


	.item-box{
		position:absolute;
		display:flex;
		flex-direction:column;
		align-items:center;
		gap:8px;}



	.box-1{top:20px;left:35px;}
	.box-2{top:20px;right:35px;}
	.box-3{bottom:20px;left:35px;}
	.box-4{bottom:20px;right:35px;}




	.item-box button{
		width:78px;
		height:78px;
		border-radius:20px;
		background-size:cover;
		background-position:center;
		border:none;
		outline:none;
		cursor:pointer;
		box-shadow:0 8px 20px rgba(0,0,0,0.3);
		transition: transform 0.1s ease;}




	.box-1 button{background-image:url("spell.png");}
	.box-2 button{background-image:url("memorize.png");}
	.box-3 button{background-image:url("listen.png");}
	.box-4 button{background-image:url("pronounce.png");}




	.item-box button:active{
		transform:scale(0.95);}




	.item-box span{
		color:white;
		font-size:14px;
		font-weight:600;
		text-shadow:0 2px 6px rgba(0,0,0,0.6);}




	.popup-overlay{
		position:fixed;
		inset:0;
		background:rgba(0,0,0,0.5);
		display:none;
		justify-content:center;
		align-items:center;
		z-index:10;}




	.popup{
		width:280px;
		max-height:400px;
		background:rgba(255,255,255,0.95);
		border-radius:20px;
		padding:15px;
		overflow-y:auto;
		box-shadow:0 10px 30px rgba(0,0,0,0.4);}




	.item{
		padding:12px;
		margin-bottom:10px;
		border-radius:12px;
		background:#f1f1f1;
		cursor:pointer;
		text-align:center;
		transition:0.2s;}
	.item:hover{
		background:#ddd;}




	.btn-cancel, .btn-delete{
  		flex:1;
  		padding:10px;
  		border:none;
  		border-radius:12px;
  		font-weight:600;
  		cursor:pointer;}



	.btn-cancel{
  		background:#ddd;}



	.btn-delete{
  		background:#ff4d4f;
  		color:white;}


</style>
</head>
<body>
	<div class="overlay"></div>
	<div class="app-container">
	<div class="card-1">
		<div class="card-2">
			<div class="item-box box-1"><button onclick="chooseMode('spell')"></button><span>Spell</span></div>
			<div class="item-box box-2"><button onclick="chooseMode('memorize')"></button><span>Memorize</span></div>
			<div class="item-box box-3"><button onclick="chooseMode('listen')"></button><span>Listen</span></div>
			<div class="item-box box-4"><button onclick="chooseMode('pronounce')"></button><span>Pronounce</span></div>
		</div>
	</div>
	</div>




	<div class="popup-overlay" id="popup">
	<div class="popup" id="listContainer"></div>
	</div>






<script>
	const LIST_NAMES = ['Từ mới', 'Chưa thuộc', 'Đã thuộc'];
	let selectedMode = null;
	let selectedKind = 'word';
	function readWordLists(){try{const lists=JSON.parse(localStorage.getItem('wordLists')||'[]');return Array.isArray(lists)?lists:[];}catch{return [];}}
	function normalizeLists(){
		const old=readWordLists();
		const fixed=LIST_NAMES.map(name=>{const found=old.find(list=>list.name===name&&Array.isArray(list.words));return {name,words:found?found.words:[]};});
		old.filter(list=>!LIST_NAMES.includes(list.name)).forEach(list=>{if(Array.isArray(list.words))fixed[0].words.push(...list.words);});
		localStorage.setItem('wordLists',JSON.stringify(fixed));return fixed;
	}
	let wordLists=normalizeLists();
	function chooseMode(mode){selectedMode=mode;renderMemorizeChoices();document.getElementById('popup').style.display='flex';}
	function openPopup(){wordLists=normalizeLists();renderLists();document.getElementById('popup').style.display='flex';}
	function closePopup(){document.getElementById('popup').style.display='none';}
	document.getElementById('popup').addEventListener('click',e=>{if(e.target.id==='popup')closePopup();});
	function renderMemorizeChoices(){const c=document.getElementById('listContainer');c.innerHTML='';['Học từ','Học câu'].forEach((label,i)=>{const row=document.createElement('div');row.className='item';row.innerText=label;row.onclick=()=>{selectedKind=i===0?'word':'sentence';localStorage.setItem('selectedKind',selectedKind);openPopup();};c.appendChild(row);});}
	function renderLists(){
		const container=document.getElementById('listContainer');container.innerHTML='';
		let lists=wordLists;
		if(selectedMode==='memorize'&&selectedKind==='sentence'){
			try{const saved=JSON.parse(localStorage.getItem('sentenceLists')||'[]');lists=LIST_NAMES.map(name=>{const found=saved.find(list=>list.name===name);return {name,words:Array.isArray(found?.words)?found.words:[]};});localStorage.setItem('sentenceLists',JSON.stringify(lists));}catch{lists=LIST_NAMES.map(name=>({name,words:[]}));}
		}
		const add=document.createElement('div');add.className='item';add.innerText=selectedKind==='sentence'?'➕ Thêm câu mới':'➕ Thêm từ mới';add.style.fontWeight='600';add.onclick=()=>window.location.href=selectedKind==='sentence'?'taocau.html':'taodanhsachtu.html';container.appendChild(add);
		lists.forEach(list=>{const row=document.createElement('div');row.className='item';row.innerText=`${list.name} (${list.words.length})`;row.onclick=()=>selectList(list);container.appendChild(row);});
	}
	function selectList(list){localStorage.setItem('selectedList',JSON.stringify(list));localStorage.setItem('selectedMode',selectedMode);localStorage.setItem('selectedKind',selectedKind);closePopup();goToLesson();}
	function goToLesson(){if(selectedMode==='spell')location.href='giaodienphanchinhta.html';else if(selectedMode==='memorize')location.href='giaodienphanghinho.html';else if(selectedMode==='listen')location.href='giaodienphannghe.html';else if(selectedMode==='pronounce')location.href='giaodienphanphatam.html';}
	document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});
</script>
</body>
</html>
