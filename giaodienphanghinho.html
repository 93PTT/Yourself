<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memorize</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">



<style>
	html, body {
    height: 100%;
overflow:hidden;
}

body{
    font-family:sans-serif;

    background-image:url("nen1.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    /* FIX full màn hình iPhone */
    height:100svh;
    height:100dvh;
}



	.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    height:100svh;
    height:100dvh;

    background:rgba(0,0,0,0.25);
    z-index:-1;
}


	.app-container{
    max-width:375px;

    position:fixed;   /* 🔥 KEY */
    top:0;
    left:0;
    right:0;
    margin:auto;

    height:100%;
    height:100svh;
    height:100dvh;

    display:flex;
    justify-content:center;
    flex-direction:column;

    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);

    padding-left:10px;
    padding-right:10px;
}



	.card-1{
		width:350px;
		height:520px;
		border-radius:20px;
		position:relative;
		box-shadow:0 8px 20px rgba(0,0,0,0.3);
		transform: translateY(-80px);}



	.card-2{
		width:340px;
		height:60px;
		margin:0 auto;
		background:transparent;
		border-radius:20px;
		padding:10px;
		display: flex;
		justify-content: center;
		box-shadow:0 20px 50px rgba(0,0,0,0.38);
		transform: translateY(40px);}





	.box-1{
		width:300px;
		height:100px;
		margin:auto;
		margin-top:20px;
		border-radius:20px;
		background:white;
		display:flex;
		align-items:center;
		padding:15px;
		font-size:17px;
		font-weight:600;
		color:#555555;
		justify-content:center;
		box-shadow:0 8px 20px rgba(0,0,0,0.28);
		text-align: center;}



	.box-2{
		width:300px;
		height:100px;
		margin:10px auto;
		margin-top:30px;
		border-radius:20px;
		background:white;
		display:flex;
		align-items:center;
		padding:15px;
		font-size:17px;
		font-weight:600;
		color:#555555;
		justify-content:center;
		box-shadow:0 8px 20px rgba(0,0,0,0.28);
		text-align: center;}




	.box-3{
		width:100px;
		height:35px;
		margin-top:-30px;
		margin-left:240px;
		border-radius:10px;
		background:transparent;
		display:flex;
		align-items:center;
		font-size:15px;
		font-weight:600;
		color:#555555;
		justify-content:center;}


	.box-4{
		width:200px;
		height:50px;
		position:absolute;
		left:75px;
		bottom:75px;
		margin:auto;
		margin-top:0;
		border-radius:10px;
		background:#d9d9d9;
		display:flex;
		align-items:center;
		font-size:20px;
		font-weight:700;
		color:#bf0200;
		justify-content:center;}





	.grid-1{
		display:grid;
		grid-template-columns:1fr 1fr 1fr;
		gap:15px;}


	.button-1{
		width:100%;
		height:100%;
		height:40px;
		align-self:center;
		border: none;
		outline: none;
		background: none;
		padding:10px;
		border-radius:15px;
		display:flex;
		align-items:center;
		justify-content:center;
		background:whitesmoke;
		font-size:17px;
		font-weight:600;
		color:#555555;
		box-shadow:0 8px 20px rgba(0,0,0,0.38);
		cursor:pointer;
		transition:0.2s;}
	
	.button-1:hover{ background:orange; }
	.button-1:active{transform:scale(0.95);}



	.grid-2{
		display:flex;
		gap:10px;
		justify-content:start;}
	.header-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 15px 0 5px;gap:10px}
	.header-row .button-2{margin:0;flex:0 0 70px}
	.header-row .box-3{width:90px;flex:0 0 90px;margin:0;text-align:right;white-space:nowrap;font-size:14px;position:relative;left:-18px}



	.button-2{
		border: none;
		outline: none;
		background: none;
		width: 70px;
		height: 50px;
		border-radius:15px;
		margin-top:10px;
		margin-left:10px;
		display:flex;
		align-items:center;
		justify-content:center;
		background:whitesmoke;
		font-size:17px;
		font-weight:600;
		color:#555555;
		box-shadow:0 8px 20px rgba(0,0,0,0.38);
		cursor:pointer;
		transition:0.2s;}
	
	.button-2:hover{ background:orange; }
	.button-2:active{transform:scale(0.95);}
	.button-2.active{
  		background: orange;
  		color: white;}
	.button-delete-current{background: #ff6b6b;color: white;font-size:17px!important}
	.word-actions{position:absolute;left:15px;right:15px;bottom:15px;display:grid;grid-template-columns:120px 120px;justify-content:center;gap:50px}
	.word-actions button{width:100%;height:40px;border:none;outline:none;padding:10px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#6bc5ff;font-size:17px;font-weight:600;color:#555;box-shadow:0 8px 20px rgba(0,0,0,0.38);cursor:pointer;transition:0.2s}
	.word-actions button:hover{background:orange}
	.word-actions button:active{transform:scale(0.95)}
	.confirm-overlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.3);z-index:999}
	.confirm-box{padding:20px 24px;border-radius:15px;background:white;font-size:16px;font-weight:600;color:#555;box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:pop 0.3s ease;text-align:center;min-width:260px}
	.confirm-actions{display:flex;gap:10px;margin-top:18px}
	.confirm-actions button{flex:1;padding:10px;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
	.confirm-cancel{background:gainsboro;color:#555}
	.confirm-delete{background:#ff6b6b;color:white}
	@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
	@media (max-width:480px){
		.app-container{justify-content:center;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
		.card-1{height:min(520px, calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 150px));min-height:420px;flex:0 1 auto}
		.card-2{margin:16px auto 0;flex:0 0 60px}
	}


	

</style>
</head>





<body>
	<div class="overlay"></div>
	<div class="app-container">
		<div class="card-1">
			<div class="header-row">
			<div class="grid-2">
    				<button id="btnAnh" class="button-2 active" onclick="showEnglish()">Anh</button>
				<button id="btnViet" class="button-2" onclick="showVietnamese()">Việt</button>
				<button class="button-2 button-delete-current" title="Xóa từ hoặc câu này" onclick="deleteCurrentItem()">Xóa</button>
			</div>
			<div class="box box-3" id="btnO3">Từ còn lại</div>
			</div>
			<div class="box box-1" id="btnO1">Ô 1</div>
			<div class="box box-2" id="btnO2">Ô 2</div>
			<div class="box box-4" id="btnO4">Phiên âm</div>
		<div class="word-actions">
			<button onclick="moveCurrentWord('Chưa thuộc')">Chưa thuộc</button>
			<button onclick="moveCurrentWord('Đã thuộc')">Đã thuộc</button>
		</div>
		</div>

		<div class="card-2 grid-1">
    			<button class="button-1" onclick="backWord()">Back</button>
    			<button class="button-1" onclick="speakWord()">Phát âm</button>
    			<button class="button-1" onclick="nextWord()">Next</button>
		</div>
	</div>
	<div class="confirm-overlay" id="deleteConfirm">
		<div class="confirm-box">
			<div id="deleteConfirmText">Xóa mục này khỏi danh sách?</div>
			<div class="confirm-actions">
				<button class="confirm-cancel" onclick="closeDeleteConfirm()">Hủy</button>
				<button class="confirm-delete" onclick="confirmDeleteItem()">Xóa</button>
			</div>
		</div>
	</div>




<script>
	let selectedList = JSON.parse(localStorage.getItem('selectedList'));
	const selectedKind = localStorage.getItem('selectedKind') || 'word';
	const storageKey = selectedKind === 'sentence' ? 'sentenceLists' : 'wordLists';
	let currentList = selectedList?.words || [];
	shuffleArray(currentList);

let currentIndex = 0;
let mode = 'en';
let showAnswer = false;
let renderVersion = 0;


async function renderWord(){
	const version = ++renderVersion;
  	if(currentList.length === 0){
	    	document.getElementById('btnO1').innerText = selectedKind==='sentence' ? 'Chưa có câu trong danh sách này' : 'Không có dữ liệu';
    	document.getElementById('btnO2').innerText = "";
    	return;
  	}

  	let word = currentList[currentIndex];

  	if(mode === 'en'){
    	// Ô 1: Việt | Ô 2: Anh
    	document.getElementById('btnO1').innerText = word.vi;
    	document.getElementById('btnO2').innerText = showAnswer ? word.en : "";
  	}else{
    	// Ô 1: Anh | Ô 2: Việt
    	document.getElementById('btnO1').innerText = word.en;
    	document.getElementById('btnO2').innerText = showAnswer ? word.vi : "";
  	}


	let ipa = await getIPA(word.en);
	// Không để phản hồi mạng cũ ghi đè từ hiện tại khi người dùng chuyển nhanh.
	if (version !== renderVersion) return;
	let ipaText = "";

	if(mode === 'en'){
  	ipaText = showAnswer ? ipa : "";
	}else{
  	ipaText = ipa;
	}

	document.getElementById('btnO4').innerText = ipaText;


  	document.getElementById('btnO3').innerText =
	    	`Còn ${currentList.length - currentIndex - 1} ${selectedKind==='sentence'?'câu':'từ'}`;
	}


	function nextWord(){
  	if(currentList.length === 0) return;

  	if(!showAnswer){
    	showAnswer = true;
  	}else{
    	if(currentIndex < currentList.length - 1){
      	currentIndex++;
      	showAnswer = false;
		} else {
		  finishLesson();
		  return;
    	}
  	}

  	renderWord();
	}

	function showEnglish(){
  	mode = 'en';

  	currentIndex = 0;
  	showAnswer = false;

  	document.getElementById('btnAnh').classList.add('active');
  	document.getElementById('btnViet').classList.remove('active');

  	renderWord();
	}


	function showVietnamese(){
  	mode = 'vi';

  	currentIndex = 0;
  	showAnswer = false;

  	document.getElementById('btnViet').classList.add('active');
  	document.getElementById('btnAnh').classList.remove('active');

  	renderWord();
	}


	showEnglish();

	function shuffleArray(array){
  	for(let i = array.length - 1; i > 0; i--){
    	let j = Math.floor(Math.random() * (i + 1));
    	[array[i], array[j]] = [array[j], array[i]];
  	}
	}

	function speakWord(){
  	if(currentList.length === 0) return;

  	let word = currentList[currentIndex].en;

	speechSynthesis.cancel();
	let utterance = new SpeechSynthesisUtterance(word);
  	utterance.lang = 'en-US';

  	speechSynthesis.speak(utterance);
	}

	async function getIPA(word){
    try {
        const url =
            `https://api.datamuse.com/words?sp=${encodeURIComponent(word.trim())}&md=r&ipa=1`;

        const res = await fetch(url);

        if(!res.ok){
            console.log("Datamuse error:", res.status);
            return "";
        }

        const data = await res.json();

        if(data.length === 0){
            console.log("Không tìm thấy:", word);
            return "";
        }

        if(data[0].tags){
            const ipa = data[0].tags.find(tag =>
                tag.startsWith("ipa_pron:")
            );

            if(ipa){
                return "/" + ipa.replace("ipa_pron:", "").trim() + "/";
            }
        }

        return "";

    } catch(e){
        console.log("IPA error:", e);
        return "";
    }
}

	function finishLesson(){
		document.getElementById('btnO1').innerText = '🎉 Hoàn thành!';
		document.getElementById('btnO2').innerText = 'Bạn đã ôn hết danh sách.';
		document.getElementById('btnO3').innerText = selectedKind==='sentence' ? '0 câu còn lại' : '0 từ còn lại';
		document.getElementById('btnO4').innerText = '';
	}

	function backWord() {
  	if(currentList.length === 0) return;

  	if(showAnswer) {

    	showAnswer = false;
  	} else {

    	if(currentIndex > 0){
      	currentIndex--;
      	showAnswer = true;
    	}
  	}

  	renderWord();
	}

	function moveCurrentWord(targetName){
		if(!currentList.length) return;
		const word=currentList[currentIndex];
		let lists=[];try{lists=JSON.parse(localStorage.getItem(storageKey)||'[]');}catch{}
		const names=['Từ mới','Chưa thuộc','Đã thuộc'];
		const fixed=names.map(name=>{const found=lists.find(list=>list.name===name);return {name,words:Array.isArray(found?.words)?found.words:[]};});
		const sourceName=selectedList?.name||'Từ mới';
		if(sourceName===targetName) return;
		const source=fixed.find(list=>list.name===sourceName);
		const target=fixed.find(list=>list.name===targetName);
		if(source){const i=source.words.findIndex(item=>item.en===word.en&&item.vi===word.vi);if(i>=0)source.words.splice(i,1);}
		target.words.push(word);
		localStorage.setItem(storageKey,JSON.stringify(fixed));
		currentList.splice(currentIndex,1);
		if(currentIndex>=currentList.length)currentIndex=Math.max(0,currentList.length-1);
		showAnswer=false;renderWord();
	}

	function deleteCurrentItem(){
		if(!currentList.length) return;
		const unit=selectedKind==='sentence'?'câu':'từ';
		document.getElementById('deleteConfirmText').innerText=`Xóa ${unit} này khỏi danh sách?`;
		document.getElementById('deleteConfirm').style.display='flex';
	}

	function closeDeleteConfirm(){document.getElementById('deleteConfirm').style.display='none';}

	function confirmDeleteItem(){
		if(!currentList.length){closeDeleteConfirm();return;}
		const item=currentList[currentIndex];
		let lists=[];try{lists=JSON.parse(localStorage.getItem(storageKey)||'[]');}catch{}
		const source=lists.find(list=>list.name===selectedList?.name);
		if(source&&Array.isArray(source.words)){
			const index=source.words.findIndex(entry=>entry.en===item.en&&entry.vi===item.vi);
			if(index>=0)source.words.splice(index,1);
			localStorage.setItem(storageKey,JSON.stringify(lists));
		}
		currentList.splice(currentIndex,1);
		if(currentIndex>=currentList.length)currentIndex=Math.max(0,currentList.length-1);
		showAnswer=false;closeDeleteConfirm();renderWord();
	}


</script>
</body>
</html>
